name: Tigat QA Automation Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # This matrix runs your test suite across multiple browsers automatically
    strategy:
      matrix:
        browser: [chrome, firefox]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest selenium webdriver-manager

      - name: Run Pytest UI Suite (${{ matrix.browser }})
        env:
          TEST_BROWSER: ${{ matrix.browser }}
        run: |
          python -m pytest test_tigat_web.py -s -v
